name: Prepare Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Generate release files
        run: |
          set +e
          OUTPUT=$(npx standard-version --skip.tag --skip.commit 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "no changes found"; then
              exit 0
            else
              exit $STATUS
            fi
          fi

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get new version
        id: version
        if: steps.changes.outputs.changed == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Use the short-lived token issued for this workflow run instead of a
          # long-lived PAT that can expire or be revoked.
          token: ${{ github.token }}
          sign-commits: true
          commit-message: "chore(release): v${{ steps.version.outputs.value }}"
          branch: "release/v${{ steps.version.outputs.value }}"
          title: "chore(release): v${{ steps.version.outputs.value }}"
          body: |
            ## Summary
            - Automated version bump and changelog update.
            - Generated by GitHub Actions after changes merged to `main`.
          labels: release
          delete-branch: true
